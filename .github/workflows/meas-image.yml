# Build the MEAS image from this fork and push it to Artifact Registry.
#
# This exists only because of the GCS-via-ADC patch on feat/gcs-adc-storage
# (see measinst/infra apps/learnhouse/40-image-ci-identity.sh for why). If that
# patch lands upstream, delete this workflow and pull ghcr.io/learnhouse/app
# instead.
#
# Named meas-* so it cannot collide with an upstream workflow when this fork
# is rebased on a new release.
name: MEAS image

on:
  push:
    branches: [meas-main, feat/gcs-adc-storage]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: short SHA)"
        required: false

permissions:
  contents: read
  id-token: write        # required to mint the WIF token

env:
  REGISTRY: us-east1-docker.pkg.dev
  IMAGE: us-east1-docker.pkg.dev/meas-inst-prod/containers/learnhouse

jobs:
  build:
    # arc-ubuntu: the measinst self-hosted scale set. Hosted runners stop at the
    # org's $0 Actions budget. The image ships no docker CLI — buildx action
    # brings its own.
    runs-on: arc-ubuntu
    steps:
      - uses: actions/checkout@v5

      - name: Work out the tag
        id: tag
        # sha-<8>, never the full sha or 7 chars: the estate's registry cleanup
        # policies and deploy validation key on this exact shape
        # (measinst/infra docs/image-releases.md).
        run: echo "value=${{ inputs.tag || format('sha-{0}', github.sha) }}" | sed -E 's/sha-([0-9a-f]{8})[0-9a-f]*/sha-\1/' >> "$GITHUB_OUTPUT"

      # Direct Workload Identity Federation — no service-account key exists to
      # leak, and org policy means one could not be minted even deliberately.
      #
      # No `service_account:` and no `token_format: access_token` here, and that
      # pairing is deliberate: this estate grants the GitHub principal the
      # Artifact Registry role directly, with no intermediary service account to
      # impersonate (see infra clusters/meas-apps/41-github-deploy-identity.sh).
      # `token_format: access_token` is implemented as SA impersonation and
      # fails outright without one. So we take the federated credential and let
      # gcloud's docker credential helper exchange it.
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/588570914403/locations/global/workloadIdentityPools/github/providers/github-oidc

      - uses: google-github-actions/setup-gcloud@v3

      - name: Authorise Docker against Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
